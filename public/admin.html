<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Administrar · Versos de Oro</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0a08">
<link rel="icon" href="/icons/versos-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/app.css">
<style>
.wrap{padding-bottom:40px}
.adm{display:flex;flex-direction:column;gap:6px;padding:16px 0;border-bottom:1px solid var(--line)}.adm:last-child{border:0}
.adm h3{font:700 23px/1.15 var(--serif);margin:0}
.adm .v{font:500 19px/1.55 var(--serif);white-space:pre-wrap;text-align:center;color:#e3d9bf;max-height:320px;overflow:auto;background:#0b0a08;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:4px 0}
.adm input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kp button{font:inherit;color:inherit;cursor:pointer;transition:border-color .15s}.kp button:active,.kp button:hover{border-color:var(--gold3)}.kp button{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.kp b{display:block;font:700 26px var(--serif);color:var(--gold2)}.kp small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.adm .sw{flex-wrap:wrap}.adm .sw .acts{width:100%}
.tabs2{overflow-x:auto;scrollbar-width:none}.tabs2::-webkit-scrollbar{display:none}.tabs2 button{font-size:13px;padding:10px 10px;white-space:nowrap;flex:1 0 auto}
.sw{display:flex;gap:12px;align-items:center;justify-content:space-between}
.sw input{width:52px;height:30px;accent-color:#d9b45a}
.adm{position:relative;transition:background .15s}
.adm.on{background:#d9b45a14;border-radius:12px}
.adm .chk{position:absolute;top:16px;right:0;width:28px;height:28px;border-radius:50%;border:2px solid var(--gold3);display:grid;place-items:center;font-weight:800;color:#1a1408}
.adm.on .chk{background:var(--goldg);border-color:transparent}
.adm .chk~.sw{padding-right:38px}
body:has(.selbar) .wrap{padding-bottom:170px}
body:has(.selbar) .adm .v{max-height:96px;overflow:hidden}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#14120ef5;backdrop-filter:blur(10px);border-top:1px solid var(--gold3);padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.selbar .acts{max-width:640px;margin:0 auto;width:100%}
.btn.danger{border-color:#ff8f7a88;color:#ffb59f}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:var(--s1);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}.chips button[aria-pressed="true"]{background:var(--goldg);color:#1a1408;border-color:transparent}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/js/admin.js"></script>
</body>
</html>
